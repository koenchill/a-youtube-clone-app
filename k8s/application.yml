apiVersion: v1
kind: Namespace
metadata:
  name: youtube-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: youtube-nginx
  namespace: youtube-lab
data:
  default.conf: "limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;\n\
    server {\n listen 8080;\n root /usr/share/nginx/html;\n index index.html;\n server_tokens\
    \ off;\n add_header X-Content-Type-Options nosniff always;\n location = /healthz\
    \ { return 200 'ok\\n'; }\n location /api/ {\n  limit_req zone=api_limit burst=20\
    \ nodelay;\n  limit_req_status 429;\n  proxy_pass http://youtube-proxy:3001;\n\
    \  proxy_connect_timeout 3s;\n  proxy_read_timeout 12s;\n }\n location / { try_files\
    \ $uri $uri/ /index.html; }\n}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-proxy
  namespace: youtube-lab
spec:
  selector:
    app: youtube-proxy
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-proxy
  namespace: youtube-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: youtube-proxy
  template:
    metadata:
      labels:
        app: youtube-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: REPLACE_WITH_PROXY_DIGEST
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: key
          mountPath: /run/secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: API_MODE
          value: demo
        - name: RAPIDAPI_KEY_FILE
          value: /run/secrets/rapidapi_key
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      - name: key
        secret:
          secretName: rapidapi-key
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-web
  namespace: youtube-lab
spec:
  selector:
    app: youtube-web
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-web
  namespace: youtube-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: youtube-web
  template:
    metadata:
      labels:
        app: youtube-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: REPLACE_WITH_WEB_DIGEST
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      - name: nginx
        configMap:
          name: youtube-nginx
